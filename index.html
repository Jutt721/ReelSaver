<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelSaver - Video Saver</title>
<meta name="description" content="ReelSaver - A simple and mobile-friendly video saving website.">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10121c;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 background:#1d2030;padding:22px;
 font-size:27px;font-weight:bold;
}
.hero{padding:38px 15px 20px}
h1{font-size:36px;margin:20px 0}
.hero p,.muted{color:#b8bdce;font-size:17px}
.card{
 background:#202437;max-width:520px;
 margin:22px auto;padding:28px 20px;
 border-radius:18px;
}
h2{font-size:23px;margin:10px 0 25px}
input,button{
 width:100%;padding:15px;margin:9px 0;
 border-radius:10px;font-size:16px;
}
input[type=url]{border:2px solid #ddd}
input[type=file]{color:white}
button{
 border:0;background:#ff665c;
 color:white;font-weight:bold;cursor:pointer;
}
button.secondary{background:#39415e}
button:active{opacity:.8}
.platforms{display:flex;gap:10px}
.platforms button{background:#39415e}
.platforms button.active{background:#ff665c}
.ad{
 max-width:520px;margin:22px auto;
 padding:20px;border:1px dashed #777;
 border-radius:12px;color:#b8bdce;
}
footer{padding:25px;color:#aaa;font-size:14px}
</style>
</head>
<body>

<header>▶ ReelSaver</header>

<section class="hero">
<h1>Save Your Videos</h1>
<p>Your videos, your choice.</p>
</section>

<div class="card">
<h2>Upload Your Own Video</h2>
<input type="file" id="video" accept="video/*">
<button onclick="downloadOwn()">Download My Video</button>
<p class="muted" id="uploadMsg">Select your original video first.</p>
</div>

<div class="card">
<h2>Video Link Saver</h2>
<div class="platforms">
<button id="tt" class="active" onclick="choose('TikTok')">TikTok</button>
<button id="ig" onclick="choose('Instagram')">Instagram</button>
</div>
<input type="url" id="videoLink" placeholder="Paste your video link here">
<button class="secondary" onclick="copyLink()">Copy Link</button>
<button class="secondary" onclick="clearLink()">Clear Link</button>
<p class="muted" id="linkMsg">Paste a link to get started.</p>
</div>

<div class="ad">
<h3>Advertisement</h3>
<p>Ad space — coming soon</p>
</div>

<footer>
<p>ReelSaver © 2026</p>
<p>Only save videos you own or have permission to use.</p>
</footer>

<script>
let platform="TikTok";

function choose(p){
 platform=p;
 document.getElementById("tt").classList.toggle("active",p==="TikTok");
 document.getElementById("ig").classList.toggle("active",p==="Instagram");
 document.getElementById("linkMsg").innerText=p+" selected. Paste your video link.";
}

function clearLink(){
 document.getElementById("videoLink").value="";
 document.getElementById("linkMsg").innerText="Link cleared.";
}

async function copyLink(){
 const link=document.getElementById("videoLink").value.trim();
 if(!link){alert("Please paste a link first.");return;}
 try{
  await navigator.clipboard.writeText(link);
  document.getElementById("linkMsg").innerText="Link copied!";
 }catch(e){
  document.getElementById("linkMsg").innerText="Please copy the link manually.";
 }
}

function downloadOwn(){
 const file=document.getElementById("video").files[0];
 if(!file){alert("Please select your video first.");return;}
 const url=URL.createObjectURL(file);
 const a=document.createElement("a");
 a.href=url;
 a.download=file.name;
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
 document.getElementById("uploadMsg").innerText="Your download has started!";
}
</script>

</body>
</html>
